quarkus.application.name=CryptoMonitor
# 8080 e o dashboard do Traefik na VPS e 8085 e o kernel do trade/backend
quarkus.http.port=${CRYPTO_MONITOR_HTTP_PORT:8086}
quarkus.http.root-path=/crypto-monitor

quarkus.datasource.db-kind=postgresql
# So em prod o endereco e fixo. Em dev/test a ausencia da url liga o Dev Services,
# que sobe um postgres:15 descartavel e roda o Liquibase nele.
%prod.quarkus.datasource.username=${DB_USER:admin}
%prod.quarkus.datasource.password=${DB_PASSWORD:}
%prod.quarkus.datasource.jdbc.url=${DATABASE_JDBC_URL:jdbc:postgresql://localhost:5432/crypto_monitor}
quarkus.datasource.devservices.image-name=postgres:15

# Liquibase e dono do schema; o Hibernate so confere o mapeamento contra ele
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=false
quarkus.liquibase.change-log=db/changelog/changelog-master.xml
quarkus.liquibase.migrate-at-start=true

mp.messaging.outgoing.estrategia.connector=smallrye-kafka
mp.messaging.outgoing.estrategia.topic=strategy
mp.messaging.outgoing.estrategia.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.estrategia.value.serializer=org.apache.kafka.common.serialization.StringSerializer
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
quarkus.kafka.devservices.enabled=false

quarkus.redis.hosts=${REDIS_URL:redis://localhost:6395}
quarkus.redis.devservices.enabled=false
redis.keys.estrategias-ativas=${REDIS_KEY_ESTRATEGIAS_ATIVAS:estrategias:ativas}

websocket.max-reconnect-attempts=10
websocket.base-reconnect-delay-seconds=5

quarkus.log.level=INFO
quarkus.log.category."com.haefliger".level=INFO
quarkus.http.access-log.enabled=true

# Log JSON estruturado — contrato do triage-gateway (GithubIssuesBoardGateway,
# docs/ARQUITETURA_TRIAGEM_AUTOMATIZADA.md §3.1). So' em producao: em dev o
# console legivel vale mais que o parse. Como o stacktrace vai dentro do campo
# JSON, o coletor nao precisa de regra de multiline.
%prod.quarkus.log.console.json.enabled=true
quarkus.log.console.json.enabled=false
quarkus.log.console.json.additional-field.service.value=crypto-monitor
quarkus.log.console.json.additional-field.env.value=${APP_ENV:desenvolvimento}
%prod.quarkus.log.console.json.additional-field.env.value=${APP_ENV:producao}
# `detailed-and-formatted` da os dois de que o fingerprint depende:
# exception.exceptionType (classe) e exception_stacktrace (texto completo).
quarkus.log.console.json.exception-output-type=detailed-and-formatted
# key-overrides le o nome do enum (LOGGER_NAME) e excluded-keys le o nome do
# campo de saida (loggerClassName); trocar as duas grafias nao gera aviso, so'
# faz a chave errada ser ignorada em silencio.
quarkus.log.console.json.key-overrides=logger_name=logger,thread_name=thread,stack_trace=exception_stacktrace
quarkus.log.console.json.excluded-keys=sequence,loggerClassName,threadId,hostName,processName,processId,ndc

# OTel — o trace_id de cada linha (mdc.traceId) e' o que liga o alerta a'
# janela de evidencia; sem ele a coleta degrada pra "janela de tempo do
# servico". Mesmo collector da VPS que o trade/backend usa, e desligado fora
# de producao porque dev/teste nao tem collector do lado.
quarkus.otel.sdk.disabled=true
%prod.quarkus.otel.sdk.disabled=false
quarkus.otel.service.name=crypto-monitor
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.traces.enabled=true
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=true
