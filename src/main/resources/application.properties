quarkus.application.name=CryptoMonitor
# 8080 e o dashboard do Traefik na VPS e 8085 e o kernel do trade/backend
quarkus.http.port=${CRYPTO_MONITOR_HTTP_PORT:8086}
quarkus.http.root-path=/crypto-monitor

quarkus.datasource.db-kind=postgresql
# So em prod o endereco e fixo. Em dev/test a ausencia da url liga o Dev Services,
# que sobe um postgres:15 descartavel e roda o Liquibase nele.
%prod.quarkus.datasource.username=${DB_USER:admin}
%prod.quarkus.datasource.password=${DB_PASSWORD:}
%prod.quarkus.datasource.jdbc.url=${DATABASE_JDBC_URL:jdbc:postgresql://localhost:5432/crypto_monitor}
quarkus.datasource.devservices.image-name=postgres:15

# Liquibase e dono do schema; o Hibernate so confere o mapeamento contra ele
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=false
quarkus.liquibase.change-log=db/changelog/changelog-master.xml
quarkus.liquibase.migrate-at-start=true

mp.messaging.outgoing.estrategia.connector=smallrye-kafka
mp.messaging.outgoing.estrategia.topic=strategy
mp.messaging.outgoing.estrategia.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.estrategia.value.serializer=org.apache.kafka.common.serialization.StringSerializer
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
quarkus.kafka.devservices.enabled=false

quarkus.redis.hosts=${REDIS_URL:redis://localhost:6395}
quarkus.redis.devservices.enabled=false
redis.keys.estrategias-ativas=${REDIS_KEY_ESTRATEGIAS_ATIVAS:estrategias:ativas}

websocket.max-reconnect-attempts=10
websocket.base-reconnect-delay-seconds=5

quarkus.log.level=INFO
quarkus.log.category."com.haefliger".level=INFO
quarkus.http.access-log.enabled=true

# OTel — e' por aqui que o log estruturado chega ao Loki, nao pelo console: o
# exporter manda severity_text, exception_type, exception_stacktrace, trace_id
# e todo MDC como structured metadata, consultavel sem `| json`. Ligar JSON no
# console em vez disto quebraria os paineis que consultam o stream de texto do
# container por regex de formato (` ERROR [`). Desligado fora de producao
# porque dev/teste nao tem collector do lado.
quarkus.otel.sdk.disabled=true
%prod.quarkus.otel.sdk.disabled=false
quarkus.otel.service.name=crypto-monitor
quarkus.otel.resource.attributes=env=producao
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.traces.enabled=true
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=true
