version: '3.8'

# O Postgres NAO fica aqui: e o container crypto_alerts_db, compartilhado com o
# backend Java, onde o CryptoMonitor usa a base propria crypto_monitor.
services:
  redis:
    image: redis:7.2
    container_name: redis
    restart: always
    ports:
      - "6395:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
